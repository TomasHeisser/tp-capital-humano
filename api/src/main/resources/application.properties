spring.application.name=capitalhumano
# las variables locales (clave de Gemini, secreto del JWT) se leen de api/.env, que no se sube
spring.config.import=optional:file:.env[.properties]
server.port=8080

# ---------- base de datos (PostgreSQL del docker-compose) ----------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/capitalhumano}
spring.datasource.username=${DB_USUARIO:capitalhumano}
spring.datasource.password=${DB_CONTRASENIA:capitalhumano}
# las tablas las crea db/schema.sql, Hibernate solo controla que coincidan
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Argentina/Buenos_Aires
spring.jackson.time-zone=America/Argentina/Buenos_Aires

# ---------- LDAP embebido con los consultores ----------
spring.ldap.embedded.ldif=classpath:directorio.ldif
spring.ldap.embedded.base-dn=dc=capitalhumano,dc=com
spring.ldap.embedded.port=8389
spring.ldap.base=dc=capitalhumano,dc=com
ldap.base-consultores=ou=consultores

# ---------- sesion (JWT) ----------
# si JWT_SECRET viene vacio se usa el secreto de desarrollo
jwt.secreto=${JWT_SECRET:}
jwt.secreto-desarrollo=capital-humano-secreto-de-desarrollo-solo-local-2026
jwt.duracion-horas=8
cors.origenes=http://localhost:3000

# ---------- parametros del cuestionario (repositorio de configuraciones) ----------
# ojo: Spring lee este archivo como ISO-8859-1, por eso las tildes van como \u00e1, \u00f3, etc.
cuestionario.instrucciones=El cuestionario est\u00e1 formado por preguntas de opci\u00f3n m\u00faltiple agrupadas en bloques. \
Para cada pregunta elija una \u00fanica opci\u00f3n. Cuando responda todas las preguntas de un bloque presione "Siguiente" \
(o "Finalizar" en el \u00faltimo bloque). Un bloque respondido no se puede volver a ver ni modificar. \
Puede retirarse y continuar m\u00e1s tarde con la misma clave, respetando el tiempo m\u00e1ximo y la cantidad m\u00e1xima de accesos.
cuestionario.preguntas-por-bloque=5
cuestionario.tiempo-maximo-minutos=120
cuestionario.vigencia-dias=7
cuestionario.max-accesos=5
# CU032: cada cuanto se revisan los cuestionarios vencidos (en milisegundos)
cuestionario.tarea.intervalo-ms=300000

# ---------- asistente de IA ----------
# gemini o simulado; si no hay clave se usa el simulado igual
ia.proveedor=${IA_PROVEEDOR:gemini}
ia.gemini.clave=${GEMINI_API_KEY:}
ia.gemini.modelo=gemini-3.8-flash
ia.gemini.url=https://generativelanguage.googleapis.com/v1beta
ia.gemini.timeout-segundos=30

# ---------- Swagger ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
